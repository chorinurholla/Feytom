name: Chains
slug: chains
order: 2
intro: Transport and high-test chain for cargo securement and general industrial work. Supplied by the bag in short working lengths, or by the drum in bulk continuous length.
decisionHelp: The grade and diameter determine the application. Grade 70 is a transport chain; Grade 43 is a general-purpose high-test chain. Confirm the correct grade for your use against the manufacturer's documentation.
