safety:
  # Replaces the generic note for this product only: once a load limit is
  # published, the conditions printed alongside it must be published too.
  generalNote: >-
    The 4,700 lb working load limit above is the figure printed on this product's
    packaging. Confirm it against the manufacturer's technical documentation
    before use, and do not exceed it. This chain is not for overhead lifting.
    Wear ANSI-approved eye protection during setup and use, inspect the chain
    before every use, do not use it if damaged, and keep it away from children.
  withheldClaims:
    - >-
      Breaking strength — not stated on the packaging and not documented.
      Withheld. A working load limit is not a breaking strength.
    - >-
      "Meets all Highway Patrol requirements" — printed on the packaging, but a
      compliance claim naming an enforcement body needs documentary support
      beyond bag artwork. Published only as "Marked for DOT transport
      requirements", which describes the marking rather than asserting approval.
    - >-
      "High-strength" — the Product List PDF opens this description with
      "High-strength Grade 70 transport chain". Withheld as an unsupported
      qualitative claim (§3.6); the grade and the load limit now carry the
      information factually.
    - >-
      "Towing" — the Product List PDF lists towing among the applications. §4
      permits towing only where manufacturer documentation supports it. Withheld.

